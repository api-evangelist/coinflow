aid: coinflow
name: Coinflow
description: >-
  Coinflow is a stablecoin-native payments platform (backed by Pantera Capital)
  that lets software companies and marketplaces accept card, ACH, and crypto/USDC
  payments and send instant payouts across Solana, EVM, and Stellar rails. Its API
  covers checkout / pay-ins, PCI-compliant tokenized card-on-file, subscriptions,
  marketplace sub-merchant onboarding with KYC/KYB, refunds, withdrawals and
  merchant payouts, and HMAC-signed webhooks. Coinflow ships pre-built UI SDKs for
  React, React Native, Swift, Android, and Flutter, plus a sandbox environment with
  published test cards and 3DS triggers.

  copied verbatim from the Coinflow testing docs; none are invented. The sandbox
  is a fully separate environment reached at the sandbox base URL; swap
  sandbox.coinflow.cash for coinflow.cash to move to production.
environments:
  sandbox_api_base: https://api-sandbox.coinflow.cash/api
  sandbox_web_host: sandbox.coinflow.cash
  production_web_host: coinflow.cash
  session_key_ttl: 24 hours
notes:

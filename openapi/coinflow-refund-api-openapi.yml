          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
      - reason
      - setBy
      - setAt
      description: 'Per-customer exemption from real-time geographic enforcement.


        When set and not expired, withdrawal blocking rules with method

        `GEOLOCATION` or `IP` are skipped for this withdrawer. `KYC_ADDRESS` rules

        still apply — KYC is the compliance floor and must remain enforceable.


        Auditable by construction: `reason` and `setBy` are required so admins can

        review why a specific user was exempted. `expiresAt` is optional but

        strongly recommended; long-lived overrides should be avoided.'
      title: IGeoBlockOverride

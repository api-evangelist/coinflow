openapi: 3.2.0
info:
  title: Reference Refund API
  version: 1.0.0
servers:
- url: https://api-sandbox.coinflow.cash/api
  description: https://api-sandbox.coinflow.cash/api
tags:
- name: Refund
paths:
  /refunds:
    get:
      operationId: refund_GetRefunds
      summary: Get Refunds
      tags:
      - Refund
      parameters:
      - name: since
        in: query
        required: false
        schema:
          type: string
      - name: until
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: source
        in: query
        required: false
        schema:
          type: string
      - name: method
        in: query
        required: false
        schema:
          type: string
      - name: merchantId
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: Payment ID or User ID / Customer ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundInfo'
      security:
      - admin: []
  /refunds/{refundId}/retry:
    post:
      operationId: refund_RetryRefund
      summary: Retry a Failed Refund
      tags:
      - Refund
      parameters:
      - name: refundId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund_RetryRefund_Response_200'
      security:
      - admin: []
  /refunds/payment/{paymentId}/all:
    get:
      operationId: refund_GetRefundsViaPaymentId
      summary: View All Refunds for Payment
      tags:
      - Refund
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IRefund'
      security:
      - admin: []
  /refunds/payment/{paymentId}:
    get:
      operationId: refund_GetRefundViaPaymentId
      summary: View Refund Information for Payment
      tags:
      - Refund
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund_GetRefundViaPaymentId_Response_200'
      security:
      - admin: []

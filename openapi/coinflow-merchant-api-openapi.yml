components:
  schemas:
    IMerchantMongooseTypesObjectIdWithdrawFeePayment:
      type: object
      properties:
        paysGasFees:
          $ref: '#/components/schemas/Partial_Record_Blockchain.boolean__'
        bundleFirstPartyPayoutFees:
          type: boolean
        bundleDelegatedPayoutFees:
          type: boolean
        paysSwapFees:

components:
  schemas:
    Pick_IIbanAccount.Exclude_keyofIIbanAccount.vendorData__:
      type: object
      properties:
        last4:
          type: string
        accountHash:
          type: string
        alias:
          type: string
        token:
          type: string
        reference:
          type: string
        sortCode:
          type: string
        bic:
          type: string
      required:
      - last4
      - accountHash
      - alias
      - token
      - reference
      - sortCode
      description: From T, pick a set of properties whose keys are in the union K
      title: Pick_IIbanAccount.Exclude_keyofIIbanAccount.vendorData__
    Blockchain.ETH:
      type: string
      enum:
      - eth
      title: Blockchain.ETH

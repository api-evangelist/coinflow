openapi: 3.2.0
info:
  title: Reference Merchant API
  version: 1.0.0
servers:
- url: https://api-sandbox.coinflow.cash/api
  description: https://api-sandbox.coinflow.cash/api
tags:
- name: Merchant
paths:
  /merchant/chargebacks/{paymentId}/accept:
    post:
      operationId: merchant_AcceptChargeback
      summary: Accept chargeback
      tags:
      - Merchant
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant_AcceptChargeback_Response_200'
      security:
      - merchant: []
  /withdraw/crypto-deposit-address/activate:
    post:
      operationId: merchant_ActivatePassiveDepositAddress
      summary: Activate Passive Deposit Address
      description: 'Activate a passive deposit address so it accepts new payments. If a deposit

        address already exists for this merchant + withdrawer + chain + token, that

        address is re-activated and returned. Otherwise a new session is created

        and its address is activated.'
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassiveDepositAddressStatusResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCryptoWithdrawBody'
      security:
      - userId: []
  /merchant/block-seller:
    put:
      operationId: merchant_BlockMarketplaceSeller
      summary: Bans a seller
      tags:
      - Merchant
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockSellerRequest'
      security:
      - merchant: []
  /merchant/payments/refunds/batch:
    put:
      operationId: merchant_BatchRefundPayments
      summary: Batch Refund Payments
      description: 'Queues a full refund for each of the given payments. Every payment is refunded

        independently - one refund job per payment, identical to refunding them one at a

        time - so a payment that cannot be refunded is reported in `results` while the rest

        still proceed.


        Partial amounts are not supported here, and payments needing a destination wallet

        are skipped with `skipped: true` on their result. Refund those payments

        individually with `PUT /merchant/payments/{paymentId}/refund`.'
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRefundResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRefundRequest'
      security:
      - merchant: []
  /merchant/blocked/{customerId}:
    put:
      operationId: merchant_UnblockAccount
      summary: Block or Unblock Customer
      tags:
      - Merchant
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                applyToLinkedRecords:
                  type: boolean
                merchantId:
                  type: string
                reason:
                  type: string
                status:
                  $ref: '#/components/schemas/AvailabilityStatus'
              required:
              - reason
      security:
      - merchant: []
  /merchant/block-withdrawer/{withdrawerId}:
    put:
      operationId: merchant_BlockOrUnblockWithdrawer
      summary: Block or Unblock Withdrawer
      tags:
      - Merchant
      parameters:
      - name: withdrawerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                applyToLinkedRecords:
                  type: boolean
                blockchain:
                  $ref: '#/components/schemas/Blockchain'
                reason:
                  type: string
                status:
                  $ref: '#/components/schemas/AvailabilityStatus'
              required:
              - reason
              - status
      security:
      - merchant: []
  /merchant/{customerId}/exempt3DS:
    put:
      operationId: merchant_Update3DSExemption
      summary: Configure 3DS exemption
      description: Change customer 3DS exemption status
      tags:
      - Merchant
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantId:
                  type: string
                exempt:
                  type: boolean
              required:
              - exempt
      security:
      - merchant: []
  /merchant/{customerId}/attemptLimit:
    put:
      operationId: merchant_UpdateAttemptLimitSetting
      summary: Configure attempt limit setting
      description: Change customer attempt limit setting
      tags:
      - Merchant
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantId:
                  type: string
                setting:
                  $ref: '#/components/schemas/FailedAttemptSetting'
              required:
              - setting
      security:
      - merchant: []
  /merchant/chargebacks/{paymentId}/respond:
    post:
      operationId: merchant_Respond
      summary: Create Chargeback Response
      description: Respond to a chargeback. This will send the response to the card network.
      tags:
      - Merchant
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Merchant_Respond_Request'
      security:
      - merchant: []
  /withdraw/crypto-deposit-address:
    post:
      operationId: merchant_CreateCryptoWithdrawDeposit
      summary: Create Crypto Withdraw Deposit
      description: 'Create a crypto deposit session for a payout. Returns a deposit address where

        the merchant can send funds. Once funds are received via the deposit webhook,

        the payout is automatically initiated.'
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoWithdrawDepositResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCryptoWithdrawBody'
      security:
      - userId: []
    get:
      operationId: merchant_GetSupportedChains
      summary: Get Supported Chains
      description: Get the list of supported chains and tokens for crypto deposit withdrawals.
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSupportedChainsResponse'
      security:
      - merchant: []
  /merchant/exports:
    post:
      operationId: merchant_CreateExport
      summary: Create Export
      description: Create a new export job
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IExport'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
      security:
      - merchant: []
    get:
      operationId: merchant_ListExports
      summary: List Exports
      description: List all exports for the merchant
      tags:
      - Merchant
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: limit
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
      - name: sortDirection
        in: query
        required: false
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IExport'
      security:
      - merchant: []
  /withdraw/crypto-deposit-address/deactivate:
    post:
      operationId: merchant_DeactivatePassiveDepositAddress
      summary: Deactivate Passive Deposit Address
      description: Deactivate (pause) a passive deposit address so it stops accepting new payments.
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassiveDepositAddressStatusResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassiveDepositAddressBody'
      security:
      - userId: []
  /merchant/exports/{exportId}:
    delete:
      operationId: merchant_DeleteExport
      summary: Delete Export
      description: Delete an export
      tags:
      - Merchant
      parameters:
      - name: exportId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - merchant: []
    get:
      operationId: merchant_GetExport
      summary: Get Export
      description: Get a specific export by ID
      tags:
      - Merchant
      parameters:
      - name: exportId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IExport'
      security:
      - merchant: []
  /merchant:
    put:
      operationId: merchant_EditMerchant
      summary: Edit Merchant
      description: Edit the merchant details
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IMerchant_mongoose.Types.ObjectId_'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                supportEmail:
                  type: string
                customerDefaultOverrideLimit:
                  $ref: '#/components/schemas/Cents'
                fraudEmails:
                  type: array
                  items:
                    type: string
                chargebackEmails:
                  type: array
                  items:
                    type: string
                billingEmails:
                  type: array
                  items:
                    type: string
                settlementAddresses:
                  $ref: '#/components/schemas/MerchantPutRequestBodyContentApplicationJsonSchemaSettlementAddresses'
                brand:
                  $ref: '#/components/schemas/MerchantBrandSettings'
                enforceJwt:
                  type: boolean
                cryptoPayinSettings:
                  $ref: '#/components/schemas/Pick_CryptoPayInSettings.customerEmailNotifications-or-merchantEmailNotifications_'
                achSettings:
                  $ref: '#/components/schemas/Pick_ACHSettings.customerEmailNotifications-or-merchantEmailNotifications_'
                cardSettings:
                  $ref: '#/components/schemas/Pick_CardSettings.customerEmailNotifications-or-merchantEmailNotifications_'
                webhookSettings:
                  $ref: '#/components/schemas/Pick_WebhookSettings.Exclude_keyofWebhookSettings.webhookUrls-or-disabledWebhookUrls__'
                colors:
                  $ref: '#/components/schemas/MerchantTheme'
                password:
                  type: string
      security:
      - merchant: []
    get:
      operationId: merchant_GetMerchant
      summary: Get Merchant
      description: Get the merchant
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IMerchant_mongoose.Types.ObjectId_'
      deprecated: true
      security:
      - merchant: []
  /merchant/payments/{paymentId}/fail:
    put:
      operationId: merchant_FailPayment
      summary: Fail Payment
      description: '-- This method is for test environment only --

        Force an ACH, Wire, Iban, CashApp or PIX payment to fail'
      tags:
      - Merchant
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - merchant: []
  /merchant/chargebacks/ach-return-rate:
    get:
      operationId: merchant_GetAchReturnRate
      summary: Get ACH return rate
      tags:
      - Merchant
      parameters:
      - name: since
        in: query
        required: false
        schema:
          type: string
      - name: until
        in: query
        required: false
        schema:
          type: string
      - name: timezone
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchReturnRate'
      security:
      - merchant: []
  /merchant/chargebacks:
    get:
      operationId: merchant_GetAllChargebacks
      summary: Get all chargebacks
      tags:
      - Merchant
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: page
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
      - name: sortDirection
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: responded
        in: query
        required: false
        schema:
          type: boolean
      - name: discrepancy
        in: query
        required: false
        schema:
          type: boolean
      - name: processor
        in: query
        required: false
        schema:
          type: string
      - name: protection
        in: query
        required: false
        schema:
          type: string
      - name: threeDSecure
        in: query
        required: false
        schema:
          type: string
      - name: merchantId
        in: query
        required: false
        schema:
          type: string
      - name: since
        in: query
        required: false
        schema:
          type: string
      - name: until
        in: query
        required: false
        schema:
          type: string
      - name: reasonCode
        in: query
        required: false
        schema:
          type: string
      - name: method
        in: query
        required: false
        schema:
          type: string
      - name: excludeMethod
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllChargebackResponse'
      security:
      - merchant: []
  /merchant/payments:
    get:
      operationId: merchant_GetAllPayments
      summary: Get All Payments
      tags:
      - Merchant
      parameters:
      - name: since
        in: query
        description: '- UTC epoch milliseconds of the earliest date to include in the results'
        required: false
        schema:
          type: string
      - name: until
        in: query
        description: '- UTC epoch milliseconds of the latest date to include in the results'
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: '- Page number to return starting from 1. Must be used with limit param.'
        required: false
        schema:
          type: number
          format: double
      - name: limit
        in: query
        description: '- amount of records per page (def. 100). Must be used with page param.'
        required: false
        schema:
          type: number
          format: double
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MerchantPaymentsGetParametersSortBy'
      - name: sortDirection
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: method
        in: query
        required: false
        schema:
          type: string
      - name: processor
        in: query
        required: false
        schema:
          type: string
      - name: protection
        in: query
        required: false
        schema:
          type: string
      - name: merchantId
        in: query
        required: false
        schema:
          type: string
      - name: amount
        in: query
        required: false
        schema:
          type: string
      - name: authCode
        in: query
        required: false
        schema:
          type: string
      - name: cardType
        in: query
        description: '- card network (VISA / MSTR / AMEX / DISC), comma separated'
        required: false
        schema:
          type: string
      - name: last4
        in: query
        description: '- last four digits of the card, comma separated'
        required: false
        schema:
          type: string
      - name: paymentId
        in: query
        description: '- comma separated payment ids'
        required: false
        schema:
          type: string
      - name: customer
        in: query
        description: '- customerId, email or customer ObjectId, comma separated'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentListResponse'
      security:
      - merchant: []
  /merchant/chargebacks/analytics/summary:
    get:
      operationId: merchant_GetChargebackAnalyticsSummary
      summary: Get chargeback analytics summary for time frame
      tags:
      - Merchant
      parameters:
      - name: since
        in: query
        description: -- YYYY-MM-DD
        required: false
        schema:
          type: string
      - name: until
        in: query
        description: -- YYYY-MM-DD
        required: false
        schema:
          type: string
      - name: timezone
        in: query
        description: -- IANA timezone the since/until dates and day buckets are interpreted in (defaults to UTC)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargebackAnalyticsSummary'
      security:
      - merchant: []
  /merchant/chargebacks/{paymentId}:
    get:
      operationId: merchant_GetChargeback
      summary: Get chargeback data
      description: Get information about a Chargeback for a payment
      tags:
      - Merchant
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant_GetChargeback_Response_200'
      security:
      - merchant: []
  /merchant/chargebacks/{paymentId}/draft:
    get:
      operationId: merchant_GetChargebackResponseDraft
      summary: Get Chargeback Response Draft
      tags:
      - Merchant
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: string
      security:
      - merchant: []
    put:
      operationId: merchant_SaveDraftAndNotes
      summary: Save Chargeback Response Draft
      tags:
      - Merchant
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                draft:
                  type: string
      security:
      - merchant: []
  /merchant/withdraws/payout/balance:
    get:
      operationId: merchant_GetPayoutBalance
      summary: Get Coinflow Wallet Balance
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant_GetPayoutBalance_Response_200'
      security:
      - merchant: []
  /merchant/withdraws/payout/crypto/tokens:
    get:
      operationId: merchant_GetCryptoPayoutTokens
      summary: Get Crypto Payout Tokens
      description: 'List the chains and tokens available as crypto payout destinations for

        this merchant. The returned `chainId` and `tokenId` are the values to

        pass as the payout destination''s `chain` and `token` — use this endpoint

        to populate destination pickers rather than hardcoding ids. Only tokens

        whose tier is enabled on the merchant account are listed.'
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoPayoutTokensResponse'
      security:
      - merchant: []
  /merchant/customers:
    get:
      operationId: merchant_GetCustomerAccounts
      summary: Get customer list
      description: List customers for a merchant
      tags:
      - Merchant
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: page
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: blocked
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MerchantCustomersGetParametersSortBy'
      - name: sortDirection
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: protection
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ICustomerWallet'
      security:
      - merchant: []
  /merchant/withdraws/payout/delegated/quote/crypto:
    post:
      operationId: merchant_GetDelegatedCryptoPayoutQuote
      summary: Get Delegated Crypto Payout Quote
      description: 'Get a quote for a delegated crypto payout: the total amount that will be

        debited from the merchant''s wallet, the configured Coinflow fee, the USD

        value the user receives, and the amount of the destination token that

        will be delivered. Non-stablecoin tokens are quoted at the current

        market rate and are not guaranteed — the delivered amount is finalized

        when the payout is processed.'
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedCryptoPayoutQuote'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegatedCryptoPayoutQuoteArgs'
      security:
      - merchant: []
  /merchant/withdraws/payout/delegated/quote:
    post:
      operationId: merchant_GetDelegatedPayoutQuote
      summary: Get Delegated Payout Quote
      description: 'Get a quote for a delegated payout including the fee breakdown.

        Shows the total amount that will be debited from the merchant''s wallet,

        the amount the user will receive, and the merchant fees.'
      tags:
      - Merchant
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedPayoutQuote'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegatedPayoutQuoteArgs'
      security:
      - merchant: []
  /merchant/payments/enhanced/{paymentId}:
    get:
      operationId: merchant_GetEnhancedTxInformation
      summary: Get Enhanced Transaction Information
      tags:
      - Merchant
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant_GetEnhancedTxInformation_Response_200'
      security:
      - merchant: []
  /merchant/exports/{exportId}/download:
    get:
      operationId: merchant_GetExportDownloadUrl
      summary: Get Export Download URL
      description: Get a signed download URL for a completed export
      tags:
      - Merchant
      parameters:
      - name: exportId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportDownloadResponse'
      security:
      - merchant: []
  /merchant/credits/status/{jobId}:
    get:
      operationId: merchant_GetJobStatus
      summary: Get Job Status
      description: Get the status of a mint or burn job
      tags:
      - Merchant
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          description: Any type
      responses:
        '200':
          description: Ok
          content:

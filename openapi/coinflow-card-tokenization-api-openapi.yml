openapi: 3.2.0
info:
  title: Reference Card Tokenization API
  version: 1.0.0
servers:
- url: https://api-sandbox.coinflow.cash/api
  description: https://api-sandbox.coinflow.cash/api
tags:
- name: Card Tokenization
paths:
  /tokenize/associate-cvv:
    post:
      operationId: cardTokenization_AssociateCvv
      summary: Associate CVV
      description: 'Tokenize Card PAN & Optionally CVV in a server to server integration.


        In order to gain access to this endpoint your company must have PCI-DSS

        certification, and provide that to your Coinflow Integrations Representative.'
      tags:
      - Card Tokenization
      parameters:
      - name: tx-token-scheme
        in: header
        description: Only required if your account is configured with a tokenization provider that uses this header — most merchants should omit it. Contact your Coinflow integrations representative if you are unsure whether this applies to you.
        required: false
        schema:
          $ref: '#/components/schemas/TokenizeAssociateCvvPostParametersTxTokenScheme'
      - name: tx-tokenex-id
        in: header
        description: Only required if your account is configured with a tokenization provider that uses this header — most merchants should omit it. If it applies to you, pass 4582952996979143 in the Sandbox Environment and 2781185452603874 in Production.
        required: false
        schema:
          type: string
      - name: tx-apikey
        in: header
        description: Only required if your account is configured with a tokenization provider that uses this header — most merchants should omit it. If it applies to you, contact your Coinflow integrations representative to receive this value.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerToServerTokenizationResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerToServerAssociatedCvvRequest'
      security:
      - merchant: []
  /tokenize/extract-card:
    post:
      operationId: cardTokenization_ExtractCard
      summary: Extract Card From Image
      description: 'Extract the card details from a photo of a physical card and tokenize them.


        This allows a customer to take a photo of their credit/debit card and have

        the card details auto-populated during checkout instead of typing them in

        manually. The card is extracted and stored as a token in Coinflow''s

        PCI-compliant vault, and the resulting token is returned so it can be used

        in the cards endpoint.


        In order to gain access to this endpoint your company must have PCI-DSS

        certification, and provide that to your Coinflow Integrations Representative.'
      tags:
      - Card Tokenization
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractCardResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractCardRequest'
      security:
      - merchant: []
  /tokenize:
    post:
      operationId: cardTokenization_Tokenize
      summary: Tokenize Card and CVV
      description: 'Tokenize Card PAN & Optionally CVV in a server to server integration.


        In order to gain access to this endpoint your company must have PCI-DSS

        certification, and provide that to your Coinflow Integrations Representative.'
      tags:
      - Card Tokenization
      parameters:
      - name: tx-token-scheme
        in: header
        description: Only required if your account is configured with a tokenization provider that uses this header — most merchants should omit it. Contact your Coinflow integrations representative if you are unsure whether this applies to you.
        required: false
        schema:
          $ref: '#/components/schemas/TokenizePostParametersTxTokenScheme'
      - name: tx-tokenex-id
        in: header
        description: Only required if your account is configured with a tokenization provider that uses this header — most merchants should omit it. If it applies to you, pass 4582952996979143 in the Sandbox Environment and 2781185452603874 in Production.
        required: false
        schema:
          type: string
      - name: tx-apikey
        in: header
        description: Only required if your account is configured with a tokenization provider that uses this header — most merchants should omit it. If it applies to you, contact your Coinflow integrations representative to receive this value.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerToServerTokenizationResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerToServerTokenizationRequest'
      security:
      - merchant: []
  /tokenize/card-only:
    post:
      operationId: cardTokenization_CardOnly
      summary: Tokenize Card Only
      description: 'Tokenize Card PAN without CVV in a server to server integration.


        In order to gain access to this endpoint your company must have PCI-DSS

        certification, and provide that to your Coinflow Integrations Representative.'
      tags:
      - Card Tokenization
      parameters:
      - name: tx-token-scheme
        in: header
        description: Only required if your account is configured with a tokenization provider that uses this header — most merchants should omit it. Contact your Coinflow integrations representative if you are unsure whether this applies to you.
        required: false
        schema:
          $ref: '#/components/schemas/TokenizeCardOnlyPostParametersTxTokenScheme'
      - name: tx-tokenex-id
        in: header
        description: Only required if your account is configured with a tokenization provider that uses this header — most merchants should omit it. If it applies to you, pass 4582952996979143 in the Sandbox Environment and 2781185452603874 in Production.
        required: false
        schema:
          type: string
      - name: tx-apikey
        in: header
        description: Only required if your account is configured with a tokenization provider that uses this header — most merchants should omit it. If it applies to you, contact your Coinflow integrations representative to receive this value.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerToServerTokenizationResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerToServerCardOnlyRequest'
      security:
      - merchant: []
components:
  schemas:
    TokenizeCardOnlyPostParametersTxTokenScheme:
      type: string
      enum:
      - sixANTOKENfour
      title: TokenizeCardOnlyPostParametersTxTokenScheme
    TokenizeAssociateCvvPostParametersTxTokenScheme:
      type: string
      enum:
      - sixANTOKENfour
      title: TokenizeAssociateCvvPostParametersTxTokenScheme
    ServerToServerAssociatedCvvRequest:
      type: object
      properties:
        token:
          type: string
          description: 'The token to associate the CVV with.


            Note: This is only for documentation purposes, this endpoint returns an HTTP

            redirect where the card data should be sent.'
        cvv:
          type: string
          description: 'The value of the CVV you wish to associate with the token.


            Note: This is only for documentation purposes, this endpoint returns an HTTP

            redirect where the card data should be sent.'
      required:
      - token
      title: ServerToServerAssociatedCvvRequest
    ExtractCardRequest:
      type: object
      properties:
        image:
          type: string
          description: 'A base64-encoded image of the physical card to extract details from.


            Note: This is only for documentation purposes, this endpoint returns an HTTP

            redirect where the card image should be sent.'
        mimeType:
          type: string
          description: 'The MIME type of the provided image. Defaults to image/jpeg.


            Note: This is only for documentation purposes, this endpoint returns an HTTP

            redirect where the card image should be sent.'
      title: ExtractCardRequest
    TokenizePostParametersTxTokenScheme:
      type: string
      enum:
      - sixANTOKENfour
      title: TokenizePostParametersTxTokenScheme
    ServerToServerTokenizationResponse:
      type: object
      properties:
        token:
          type: string
        firstSix:
          type: string
        lastFour:
          type: string
        referenceNumber:
          type: string
        success:
          type: boolean
        error:
          type: string
        message:
          type: string
      required:
      - token
      - firstSix
      - lastFour
      - referenceNumber
      - success
      - error
      - message
      title: ServerToServerTokenizationResponse
    ServerToServerCardOnlyRequest:
      type: object
      properties:
        data:
          type: string
          description: 'The data to be tokenized. This is the PAN of the card.

            Example: 4111111111111111


            Note: This is only for documentation purposes, this endpoint returns an HTTP

            redirect where the card data should be sent.'
      title: ServerToServerCardOnlyRequest
    ServerToServerTokenizationRequest:
      type: object
      properties:
        data:
          type: string
          description: 'The data to be tokenized. This is the PAN of the card.

            Example: 4111111111111111


            Note: This is only for documentation purposes, this endpoint returns an HTTP

            redirect where the card data should be sent.'
        cvv:
          type: string
          description: 'The value of the CVV you want to associate with the token.


            Note: This is only for documentation purposes, this endpoint returns an HTTP

            redirect where the card data should be sent.'
      title: ServerToServerTokenizationRequest
    ExtractCardResponse:
      type: object
      properties:
        token:
          type: string
          description: 'The token representing the extracted card. Use this token in the cards

            endpoint to complete the checkout.'
        firstSix:
          type: string
          description: The first six digits of the extracted card number.
        lastFour:
          type: string
          description: The last four digits of the extracted card number.
        expirationMonth:
          type:
          - string
          - 'null'
          description: The extracted card expiration month, if available.
        expirationYear:
          type:
          - string
          - 'null'
          description: The extracted card expiration year, if available.
        cvvCaptured:
          type: boolean
          description: Whether a CVV/CVC was captured from the image and stored with the token.
      required:
      - token
      - firstSix
      - lastFour
      - expirationMonth
      - expirationYear
      - cvvCaptured
      title: ExtractCardResponse
  securitySchemes:
    wallet:
      type: apiKey
      in: header
      name: x-coinflow-auth-wallet
      description: The web3 wallet of the end user - see https://docs.coinflow.cash/api-reference/api-reference/authentication/get-session-key
    blockchain:
      type: apiKey
      in: header
      name: x-coinflow-auth-blockchain
      description: The blockchain associated with the end user - see https://docs.coinflow.cash/api-reference/api-reference/authentication/get-session-key
    userId:
      type: apiKey
      in: header
      name: x-coinflow-auth-user-id
      description: The external identifier of the end user - see https://docs.coinflow.cash/api-reference/api-reference/authentication/get-session-key
    merchant:
      type: apiKey
      in: header
      name: Authorization
      description: The API key of the merchant - see https://docs.coinflow.cash/api-reference/api-reference/authentication/get-session-key
    signedMessage:
      type: apiKey
      in: header
      name: x-coinflow-auth-signed-message
      description: The message signed by the users wallet
    merchantId:
      type: apiKey
      in: header
      name: x-coinflow-auth-merchant-id
      description: The merchant ID the session should be generated for
    sessionKey:
      type: apiKey
      in: header
      name: x-coinflow-auth-session-key
      description: The session key generated for the end user - see https://docs.coinflow.cash/api-reference/api-reference/authentication/get-session-key
    admin:
      type: apiKey
      in: header
      name: Authorization
x-provenance:
  method: harvested
  publisher: Coinflow
  source: https://docs.coinflow.cash/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)

openapi: 3.2.0
info:
  title: Reference Marketplace API
  version: 1.0.0
servers:
- url: https://api-sandbox.coinflow.cash/api
  description: https://api-sandbox.coinflow.cash/api
tags:
- name: Marketplace
paths:
  /seller/usdc-withdraw/recipient:
    post:
      operationId: marketplace_AddUsdcWithdrawRecipient
      summary: Adds a USDC recipient
      description: Registers a solana address that can receive USDC from the merchant’s Coinflow wallet balance
      tags:
      - Marketplace
      responses:
        '200':
          description: Successful response
        '451':
          description: Must Complete Additional Verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequiredResponse'
      requestBody:
        description: '- The recipient''s solana wallet address'
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
              required:
              - recipient
      security:
      - merchant: []
    delete:
      operationId: marketplace_RemoveUsdcWithdrawRecipient
      summary: Removes a USDC recipient
      description: Removes a solana address from the merchant's allowlisted USDC recipients
      tags:
      - Marketplace
      responses:
        '200':
          description: Successful response
      requestBody:
        description: '- The recipient''s solana wallet address'
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
              required:
              - recipient
      security:
      - merchant: []
  /seller:
    post:
      operationId: marketplace_CreateSeller
      summary: Create Seller
      description: 'Given the verification information, register a seller to a marketplace.


        When the seller must complete additional verification the API responds

        with a 451 containing a `verificationLink`. Send the seller there; once

        they finish, they are returned to `body.redirectUrl` when supplied, and

        otherwise to the marketplace''s Coinflow seller login page.'
      tags:
      - Marketplace
      responses:
        '200':
          description: Successful response
        '451':
          description: Must Complete Additional Verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequiredResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSellerRequest'
  /seller/usdc-withdraw:
    post:
      operationId: marketplace_SellerUsdcWithdraw
      summary: Creates a USDC withdrawal transaction for a merchant using the Coinflow wallet
      description: Creates a usdc withdrawal transaction for merchants using Coinflow wallet- so they can withdraw usdc from their wallet.
      tags:
      - Marketplace
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerUsdcWithdrawResponse'
        '451':
          description: Must Complete Additional Verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequiredResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerUsdcWithdrawRequest'
      security:
      - merchant: []
  /marketplace/kyc/download/{verificationId}:
    get:
      operationId: marketplace_DownloadKyc
      summary: Download Seller KYC verification report
      tags:
      - Marketplace
      parameters:
      - name: verificationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - merchant: []
  /marketplace/link/purchase:
    post:
      operationId: marketplace_GetPurchaseLink
      summary: Get Purchase Link
      description: 'Get a link which the marketplace can redirect or present via iframe to the

        customer for them to complete a purchase with a seller.'
      tags:
      - Marketplace
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceLinkResponse'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMarketplacePurchaseLinkRequest'
      security:
      - merchant: []
  /marketplace/link/purchase/credits:
    post:
      operationId: marketplace_GetPurchaseWithCreditsLink
      summary: Get Purchase with Credits link
      description: Get a link for a user to make a marketplace purchase with their Credits Balance
      tags:
      - Marketplace
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceLinkResponse'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                checkoutJwtToken:
                  type: string
                email:
                  type: string
              required:
              - checkoutJwtToken
      security:
      - merchant: []
  /marketplace/link/seller/login:
    post:
      operationId: marketplace_GetSellerLoginLink
      summary: Get Seller Login Link
      description: 'Get a link which the marketplace can redirect sellers to login to

        their dashboards and view purchases and withdraw their money.'
      tags:
      - Marketplace
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceLinkResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Marketplace_GetSellerLoginLink_Request'
      security:
      - merchant: []
  /marketplace/link/seller/registration:
    post:
      operationId: marketplace_GetSellerRegisterLink
      summary: Get Seller Registration Link
      description: 'Get a link which the marketplace can redirect new sellers to register

        their accounts.'
      tags:
      - Marketplace
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceLinkResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMarketplaceSellerRegistrationLinkRequest'
      security:
      - merchant: []
  /seller/verifyTransaction:
    get:
      operationId: marketplace_GetVerifyTransaction
      summary: Get Seller Verification Transaction
      description: 'Returns a verification transaction so the seller needs to sign and send with their MPC wlalet.

        The transaction verifies that they have access to the authentication method tied to the MPC wallet which is linked

        to their Coinflow Account.'
      tags:
      - Marketplace
      parameters:
      - name: parentId
        in: query
        description: '- The parent merchant ID (can be merchantId or _id)'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: string
      security:
      - wallet: []
  /marketplace/link/subscription:
    post:
      operationId: marketplace_GetSubscribeLink
      summary: Get Subscription Link
      description: 'Get a link which the marketplace can redirect or present via iframe to the

        customer for them to subscribe to a particular seller''s subscription.'
      tags:
      - Marketplace
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceLinkResponse'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMarketplaceSubscribeLinkRequest'
      security:
      - merchant: []
  /marketplace/wallet:
    post:
      operationId: marketplace_GetWalletAddressByEmail
      summary: Get wallet by email
      description: 'Given an email address returns the MPC wallet address for the user. Can

        be used to pass into the SDK, query the API, and check balances.'
      tags:
      - Marketplace
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marketplace_GetWalletAddressByEmail_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
      security:
      - merchant: []
components:
  schemas:
    FlightUpgradeCartItemItemClass:
      type: string
      enum:
      - flightUpgrade
      description: 'Denotes the cart item class. The item schema is chosen based on this value.

        Allowed value: flightUpgrade

        Example: flightUpgrade'
      title: FlightUpgradeCartItemItemClass
    TravelCartItem:
      type: object
      properties:
        itemClass:
          $ref: '#/components/schemas/TravelCartItemItemClass'
          description: 'Denotes the cart item class. The item schema is chosen based on this value.

            Allowed value: travel

            Example: travel'
        id:
          type: string
          description: 'The cart items''s unique ID

            Example: 5de33332-546a-4171-8988-2a43d2bfe9c6'
        rawProductData:
          $ref: '#/components/schemas/AnyObject'
        sellingPrice:
          $ref: '#/components/schemas/CurrencyAmount'
        listPrice:
          $ref: '#/components/schemas/CurrencyAmount'
        recipientInfo:
          $ref: '#/components/schemas/RecipientInfo'
        lodging:
          $ref: '#/components/schemas/TravelLodging'
        pnr:
          type: string
          description: 'The flight ticket''s PNR code

            Example: X36Q9C'
        trip:
          $ref: '#/components/schemas/TravelTrip'
        firstFlight:
          $ref: '#/components/schemas/TravelFirstFlight'
      required:
      - itemClass
      - sellingPrice
      - lodging
      - pnr
      - trip
      - firstFlight
      description: Represents a travel booking item in a shopping cart
      title: TravelCartItem
    Verification:
      type: object
      properties:
        reference:
          type: string
        status:
          $ref: '#/components/schemas/VerificationStatus'
        vendor:
          $ref: '#/components/schemas/VerificationVendor'
        name:
          type: string
        attested:
          type: boolean
        shareToken:
          type: string
        shareTokenStatus:
          type: string
        sessionToken:
          type: string
        rejectionReasons:
          type: array
          items:
            type: string
      required:
      - reference
      - status
      - vendor
      title: Verification
    MerchantStyle:
      type: string
      enum:
      - rounded
      - sharp
      - pill
      title: MerchantStyle
    LodgingCartItem:
      type: object
      properties:
        reservationId:
          type: string
          description: 'Hotel reservation id

            Example: X36Q9C'
        nights:
          type: number
          format: double
          description: 'The number of nights booked in the reservation

            Min value: 1

            Example: 2'
        checkInDate:
          type: string
          description: 'The check-in date

            Example: 2022-05-02'
        checkInHour:
          type: string
          description: 'The hour of day in which the check-in is done

            Example: 18

            Pattern: ^([01][0-9]|2[0-3])$'
        hotel:
          $ref: '#/components/schemas/TravelLodgingHotel'
        wereExtrasPurchased:
          type: boolean
          description: Indicates whether extras were purchased in the reservation
        isRefundable:
          type: boolean
          description: Indicates whether the reservation is refundable
        highestRoomType:
          type: string
          description: 'The most luxurious room booked in the reservation

            Example: Presidential Suite'
        numberOfRooms:
          type: number
          format: double
          description: 'The number of rooms booked in the reservation

            Min value: 1

            Example: 2'
        numberOfGuests:
          type: number
          format: double
          description: 'The number of guests in the reservation

            Min value: 1

            Example: 4'
        numberOfKids:
          type: number
          format: double
          description: 'The number of kids, out of the number of guests in the reservation

            Min value: 0

            Example: 2'
        itemClass:
          $ref: '#/components/schemas/LodgingCartItemItemClass'
          description: 'Denotes the cart item class. The item schema is chosen based on this value.

            Allowed value: lodging

            Example: lodging'
        id:
          type: string
          description: 'The cart items''s unique ID

            Example: 5de33332-546a-4171-8988-2a43d2bfe9c6'
        rawProductData:
          $ref: '#/components/schemas/AnyObject'
        sellingPrice:
          $ref: '#/components/schemas/CurrencyAmount'
        listPrice:
          $ref: '#/components/schemas/CurrencyAmount'
        recipientInfo:
          $ref: '#/components/schemas/RecipientInfo'
      required:
      - reservationId
      - nights
      - checkInDate
      - checkInHour
      - hotel
      - wereExtrasPurchased
      - isRefundable
      - highestRoomType
      - numberOfRooms
      - numberOfGuests
      - numberOfKids
      - itemClass
      - sellingPrice
      description: 'Represents a lodging reservation item in a shopping cart.

        The reservation fields are flattened at the top level of the item.'
      title: LodgingCartItem
    SellerUsKycBody:
      type: object
      properties:
        email:
          type: string
          pattern: (([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))
        onboardingToken:
          type: string
          description: 'Server-signed onboarding token minted by the parent marketplace. The

            parent is derived from this token — it cannot be supplied directly.

            Not required when the request is authenticated with the marketplace''s

            API key; the parent is then derived from the key.'
        sellerId:
          type: string
          description: MerchantId of the individual seller
        redirectUrl:
          type: string
          description: '(optional): The URL to which the seller will be redirected after

            successfully completing verification via verificationLink. This applies

            when the API responds with a 451 status code, instructing the caller to

            direct the seller to verificationLink first. Defaults to the marketplace''s

            Coinflow seller login page.


            Web (http/https) URLs must point at an origin you have registered with

            Coinflow — a whitelisted embedding URL or your account''s website. Native

            app deep links (for example `myapp://verified`) are also accepted.'
        individual:
          type: boolean
        info:
          $ref: '#/components/schemas/KycUserInformation'
      required:
      - email
      - sellerId
      - individual
      - info
      title: SellerUsKycBody
    TravelTripHighestClass:
      type: string
      enum:
      - economy
      - luxurious
      description: '`luxurious` if the highest bought travel class in the trip is a luxury class (business/first), `economy` otherwise

        Example: luxurious'
      title: TravelTripHighestClass
    CartClassOmitted:
      type: array
      items:
        $ref: '#/components/schemas/CartItemClassOmitted'
      description: Cart item details required for Coinflow Chargeback Protection. Required if the merchant uses chargeback protection.
      title: CartClassOmitted
    GetMarketplacePurchaseLinkRequest:
      type: object
      properties:
        fixedFee:
          $ref: '#/components/schemas/Cents'
        threeDsChallengePreference:
          $ref: '#/components/schemas/ThreeDsChallengePreference'
        customerInfo:
          $ref: '#/components/schemas/CustomerInfo'
        webhookInfo:
          $ref: '#/components/schemas/AnyObject'
        chargebackProtectionData:
          $ref: '#/components/schemas/CartClassOmitted'
        feePercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: 'If this purchase is for a seller/submerchant where the marketplace takes a fee, this is the % fee which is

            taken from the subtotal amount.'
        sellerId:
          type: string
          description: ID of the Seller
        email:
          type: string
          pattern: (([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))
          description: The email of the end user who is making the purchase.
        theme:
          $ref: '#/components/schemas/MerchantTheme'
        redirectUri:
          type: string
          description: (Optional) URL to redirect on successful purchase
        deviceId:
          type: string
          description: If using Chargeback Protection pass the users DeviceID here
        supportEmail:
          type: string
          description: The support email for your marketplace, will be displayed to users so they can contact your team to request support.
        subtotal:
          $ref: '#/components/schemas/Cents'
      required:
      - sellerId
      - email
      - subtotal
      title: GetMarketplacePurchaseLinkRequest
    PickGiftCardCartItemExcludeKeyofGiftCardCartItemListPriceSellingPrice:
      type: object
      properties:
        currency:
          type: string
        valueInCurrency:
          type: number
          format: double
      required:
      - currency
      - valueInCurrency
      title: PickGiftCardCartItemExcludeKeyofGiftCardCartItemListPriceSellingPrice
    PhoneInfo:
      type: object
      properties:
        carrier:
          type: string
          description: 'The mobile carrier

            Example: T-Mobile'
        countryCode:
          type: string
          description: 'The country code (leading `+` is optional)

            Example: 42

            Pattern: ^\+?[0-9]+$'
        phone:
          type: string
          description: 'The phone number without the country code or hyphens

            Example: 2025550169

            Pattern: ^[0-9]+$'
      required:
      - countryCode
      - phone
      description: Phone information structure
      title: PhoneInfo
    SellerDocVKybBody:
      type: object
      properties:
        email:
          type: string
          pattern: (([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))
        onboardingToken:
          type: string
          description: 'Server-signed onboarding token minted by the parent marketplace. The

            parent is derived from this token — it cannot be supplied directly.

            Not required when the request is authenticated with the marketplace''s

            API key; the parent is then derived from the key.'
        sellerId:
          type: string
          description: MerchantId of the individual seller
        redirectUrl:
          type: string
          description: '(optional): The URL to which the seller will be redirected after

            successfully completing verification via verificationLink. This applies

            when the API responds with a 451 status code, instructing the caller to

            direct the seller to verificationLink first. Defaults to the marketplace''s

            Coinflow seller login page.


            Web (http/https) URLs must point at an origin you have registered with

            Coinflow — a whitelisted embedding URL or your account''s website. Native

            app deep links (for example `myapp://verified`) are also accepted.'
        business:
          type: boolean
        country:
          type: string
      required:
      - email
      - sellerId
      - business
      - country
      title: SellerDocVKybBody
    RecipientInfoWallet:
      type: object
      properties:
        custodialType:
          $ref: '#/components/schemas/RecipientInfoWalletCustodialType'
          description: 'The type of the wallet

            Allowed values: custodial, nonCustodial, unknown

            Example: custodial'
        blockchain:
          type: string
          description: 'The blockchain on which the transaction was made

            Example: BTC

            Pattern: ^[A-Z0-9-]+$'
        address:
          type: string
          description: The crypto wallet address that will receive the funds
      required:
      - custodialType
      - blockchain
      - address
      description: The crypto wallet that will receive the funds
      title: RecipientInfoWallet
    VerificationStatus:
      type: string
      enum:
      - pending
      - partial-approval
      - approved
      - rejected
      - expired
      title: VerificationStatus
    CartItemClassOmitted:
      oneOf:
      - $ref: '#/components/schemas/Pick_nftCartItem.Exclude_keyofnftCartItem.sellingPrice-or-itemClass__'
      - $ref: '#/components/schemas/Pick_GiftCardCartItem.Exclude_keyofGiftCardCartItem.listPrice__'
      - $ref: '#/components/schemas/CryptoCartItem'
      - $ref: '#/components/schemas/MoneyTopUpCartItem'
      - $ref: '#/components/schemas/TravelCartItem'
      - $ref: '#/components/schemas/FlightTicketCartItem'
      - $ref: '#/components/schemas/FlightUpgradeCartItem'
      - $ref: '#/components/schemas/LodgingCartItem'
      title: CartItemClassOmitted
    SellerDocVKycBody:
      type: object
      properties:
        email:
          type: string
          pattern: (([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))
        onboardingToken:
          type: string
          description: 'Server-signed onboarding token minted by the parent marketplace. The

            parent is derived from this token — it cannot be supplied directly.

            Not required when the request is authenticated with the marketplace''s

            API key; the parent is then derived from the key.'
        sellerId:
          type: string
          description: MerchantId of the individual seller
        redirectUrl:
          type: string
          description: '(optional): The URL to which the seller will be redirected after

            successfully completing verification via verificationLink. This applies

            when the API responds with a 451 status code, instructing the caller to

            direct the seller to verificationLink first. Defaults to the marketplace''s

            Coinflow seller login page.


            Web (http/https) URLs must point at an origin you have registered with

            Coinflow — a whitelisted embedding URL or your account''s website. Native

            app deep links (for example `myapp://verified`) are also accepted.'
        individual:
          type: boolean
        country:
          type: string
        disableAutoApprove:
          type: boolean
      required:
      - email
      - sellerId
      - individual
      - country
      title: SellerDocVKycBody
    RecipientInfoWalletCustodialType:
      type: string
      enum:
      - custodial
      - nonCustodial
      - unknown
      description: 'The type of the wallet

        Allowed values: custodial, nonCustodial, unknown

        Example: custodial'
      title: RecipientInfoWalletCustodialType
    LodgingCartItemItemClass:
      type: string
      enum:
      - lodging
      description: 'Denotes the cart item class. The item schema is chosen based on this value.

        Allowed value: lodging

        Example: lodging'
      title: LodgingCartItemItemClass
    PickGiftCardCartItemExcludeKeyofGiftCardCartItemListPriceItemFulfillment:
      type: string
      enum:
      - digital
      - physical
      description: How the product was fulfilled.
      title: PickGiftCardCartItemExcludeKeyofGiftCardCartItemListPriceItemFulfillment
    TravelLodgingHotel:
      type: object
      properties:
        name:
          type: string
          description: 'The name of the hotel

            Example: The Plaza Hotel'
        country:
          type: string
          description: 'The two-letter code of the country in which the hotel is located

            Example: US

            Pattern: ^[A-Z]{2}$'
        city:
          type: string
          description: 'The city in which the hotel is located

            Example: New York'
      required:
      - name
      - country
      - city
      description: The booked hotel details
      title: TravelLodgingHotel
    SellerUsdcWithdrawRequest:
      type: object
      properties:
        destination:
          type: string
        amount:
          $ref: '#/components/schemas/Cents'
      required:
      - destination
      - amount
      title: SellerUsdcWithdrawRequest
    AnyObject:
      type: object
      properties:
        example:
          type: string
      title: AnyObject
    SellerUsKybBody:
      type: object
      properties:
        email:
          type: string
          pattern: (([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))
        onboardingToken:
          type: string
          description: 'Server-signed onboarding token minted by the parent marketplace. The

            parent is derived from this token — it cannot be supplied directly.

            Not required when the request is authenticated with the marketplace''s

            API key; the parent is then derived from the key.'
        sellerId:
          type: string
          description: MerchantId of the individual seller
        redirectUrl:
          type: string
          description: '(optional): The URL to which the seller will be redirected after

            successfully completing verification via verificationLink. This applies

            when the API responds with a 451 status code, instructing the caller to

            direct the seller to verificationLink first. Defaults to the marketplace''s

            Coinflow seller login page.


            Web (http/https) URLs must point at an origin you have registered with

            Coinflow — a whitelisted embedding URL or your account''s website. Native

            app deep links (for example `myapp://verified`) are also accepted.'
        business:
          type: boolean
        info:
          $ref: '#/components/schemas/KybInformation'
        ubos:
          type: array
          items:
            $ref: '#/components/schemas/UboInfo'
          description: Ultimate Beneficiary owners, these are Officers, Directors, Investors and Beneficiaries who own more than 20% of the company.
      required:
      - email
      - sellerId
      - business
      - info
      - ubos
      title: SellerUsKybBody
    CustomerInfo:
      oneOf:
      - $ref: '#/components/schemas/SplitNameCustomerInfo'
      - $ref: '#/components/schemas/NameCustomerInfo'
      title: CustomerInfo
    GetMarketplaceSellerEmailLoginLinkRequest:
      type: object
      properties:
        email:
          type: string
          description: Email which the seller will use the login to their seller dashboard.
      required:
      - email
      title: GetMarketplaceSellerEmailLoginLinkRequest
    SplitNameCustomerInfo:
      type: object
      properties:
        verificationId:
          type: string
        displayName:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:

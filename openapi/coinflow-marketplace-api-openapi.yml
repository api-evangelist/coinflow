      properties:
        numberOfFlights:
          type: number
          format: double
          description: 'The number of flights in the trip

            Min value: 1

            Example: 2'
        numberOfCheckedBags:
          type: number
          format: double
          description: 'The number of checked bags

            Min value: 0

            Example: 1'
        firstWayDestination:
          type: string
          description: 'The first-way destination''s three-letter IATA airport code

            Example: JFK

            Pattern: ^[A-Z]{3}$'
        isRoundTrip:
          type: boolean
          description: '`true` if the trip is a round-trip

            Example: true'
        highestClass:
          $ref: '#/components/schemas/TravelTripHighestClass'
          description: '`luxurious` if the highest bought travel class in the trip is a luxury class (business/first), `economy` otherwise

            Example: luxurious'
        isFlexibleTicket:
          type: boolean
          description: 'True if the trip ticket is a flexible ticket

            Example: true'
        wereExtrasPurchased:

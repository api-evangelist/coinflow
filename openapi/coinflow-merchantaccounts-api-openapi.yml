openapi: 3.2.0
info:
  title: Reference Merchant Accounts API
  version: 1.0.0
servers:
- url: https://api-sandbox.coinflow.cash/api
  description: https://api-sandbox.coinflow.cash/api
tags:
- name: merchantAccounts
paths:
  /merchant/accounts/subsidiaries:
    post:
      operationId: merchantAccounts_CreateSubsidiary
      summary: Create Subsidiary
      tags:
      - merchantAccounts
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant_Accounts_CreateSubsidiary_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
      security:
      - merchant: []
    get:
      operationId: merchantAccounts_GetSubsidiaries
      summary: Get Subsidiaries
      tags:
      - merchantAccounts
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedAccount'
      security:
      - merchant: []
  /merchant/accounts/transfers:
    post:
      operationId: merchantAccounts_CreateTransfer
      summary: Create Transfer
      tags:
      - merchantAccounts
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedTransferRequest'
      security:
      - merchant: []
  /merchant/accounts/transfers/{addressId}:
    get:
      operationId: merchantAccounts_GetAccountTransfers
      summary: Get Account Transfers
      tags:
      - merchantAccounts
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
      - name: skip
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: limit
        in: query
        required: false
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedTransferPage'
      security:
      - merchant: []
  /merchant/accounts/primary-account:
    get:
      operationId: merchantAccounts_GetPrimaryAccount
      summary: Get Primary Account
      tags:
      - merchantAccounts
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
      security:
      - merchant: []
  /merchant/accounts/subsidiaries/{subsidiaryId}:
    delete:
      operationId: merchantAccounts_RemoveSubsidiary
      summary: Remove Subsidiary
      tags:
      - merchantAccounts
      parameters:
      - name: subsidiaryId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - merchant: []
components:
  schemas:
    ManagedTransferRequest:
      type: object
      properties:
        sourceId:
          type: string
        destinationId:
          type: string
        amount:
          $ref: '#/components/schemas/Cents'
        note:
          type: string
      required:
      - sourceId
      - destinationId
      - amount
      title: ManagedTransferRequest
    ManagedAccount:
      type: object
      properties:
        name:
          type: string
        accountId:
          type: string
        address:
          type: string
        status:
          $ref: '#/components/schemas/ManagedAccountStatus'
        balance:
          $ref: '#/components/schemas/CurrencyCents'
        transferPending:
          type: boolean
      required:
      - name
      - accountId
      - status
      - balance
      - transferPending
      title: ManagedAccount
    Cents:
      type: object
      properties:
        cents:
          type: integer
          minimum: 0
      required:
      - cents
      title: Cents
    ManagedTransfer:
      type: object
      properties:
        transferId:
          type: string
        status:
          $ref: '#/components/schemas/EmbeddedTransferStatus'
        direction:
          $ref: '#/components/schemas/ManagedTransferDirection'
        amount:
          $ref: '#/components/schemas/CurrencyCents'
        notes:
          type: string
        signature:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - transferId
      - status
      - direction
      - amount
      - createdAt
      title: ManagedTransfer
    ManagedAccountStatus:
      type: string
      enum:
      - pending
      - active
      - archived
      title: ManagedAccountStatus
    Currency:

openapi: 3.2.0
info:
  title: Reference Merchant Subscription API
  version: 1.0.0
servers:
- url: https://api-sandbox.coinflow.cash/api
  description: https://api-sandbox.coinflow.cash/api
tags:
- name: merchantSubscription
paths:
  /merchant/subscription/subscribers/{subscriptionId}:
    patch:
      operationId: merchantSubscription_CancelSubscription
      summary: Cancel Subscription (by merchant)
      description: Cancel a subscription
      tags:
      - merchantSubscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - merchant: []
    get:
      operationId: merchantSubscription_GetSubscriptionPayments
      summary: Get Subscription Payments
      description: Get the payments applied to a subscription
      tags:
      - merchantSubscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPayment'
      security:
      - merchant: []
  /merchant/subscription/plans:
    post:
      operationId: merchantSubscription_CreatePlan
      summary: Create Plans
      description: Create a new subscription plan
      tags:
      - merchantSubscription
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlan'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPlanRequest'
      security:
      - merchant: []
    get:
      operationId: merchantSubscription_GetPlans
      summary: Get Plans
      description: Get subscription plans
      tags:
      - merchantSubscription
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlan'
      security:
      - merchant: []
  /merchant/subscription/plans/{planId}:
    delete:
      operationId: merchantSubscription_DeactivatePlan
      summary: Deactivate Plan
      description: 'Deactivate a subscription plan

        If no subscribers, will be deleted.

        New subscriptions will not be allowed.'
      tags:
      - merchantSubscription
      parameters:
      - name: planId
        in: path
        description: '- can be the id or the plan code'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - merchant: []
    put:
      operationId: merchantSubscription_UpdatePlan
      summary: Update Plan
      description: Update a subscription plan
      tags:
      - merchantSubscription
      parameters:
      - name: planId
        in: path
        description: '- can be the id or the plan code'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlan'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Partial_SubscriptionPlanRequest_'
      security:
      - merchant: []
  /merchant/subscription/plans/{planId}/subscribers:
    get:
      operationId: merchantSubscription_GetSubscriptions
      summary: Get Subscribers
      description: Get the subscriptions for a subscription plan
      tags:
      - merchantSubscription
      parameters:
      - name: planId
        in: path
        description: '- can be the id or the plan code'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionDisplay'
      security:
      - merchant: []
components:
  schemas:
    Partial_SubscriptionPlanRequest_:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        interval:
          $ref: '#/components/schemas/SubscriptionInterval'
        duration:
          type: integer
          minimum: 1
        amount:
          $ref: '#/components/schemas/CurrencyCents'
        description:
          type: string
        transaction:
          type: string
        settlementChain:
          $ref: '#/components/schemas/OperationalBlockchain'
        active:
          type: boolean
        merchantInitiated:
          type: boolean
          description: Only specify this as true if you do not want subscription payments automatically processed. Then you will be responsible for manually calling the merchant initiated transaction endpoint.
      description: Make all properties in T optional
      title: Partial_SubscriptionPlanRequest_
    Blockchain.SOLANA:
      type: string
      enum:
      - solana
      title: Blockchain.SOLANA
    SubscriptionDisplay:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        blockchain:
          $ref: '#/components/schemas/Blockchain'
        merchantId:
          type: string
        email:
          type: string
        plan:
          type: string
        planCode:
          type: string
        nextPaymentAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
      required:
      - id
      - customerId
      - merchantId
      - email
      - plan
      - planCode
      - status
      title: SubscriptionDisplay
    Blockchain.MONAD:
      type: string
      enum:
      - monad
      title: Blockchain.MONAD
    SubscriptionInterval:
      type: string
      enum:
      - Daily
      - Weekly
      - Monthly
      - Yearly
      title: SubscriptionInterval
    Blockchain:
      type: string
      enum:
      - solana
      - eth
      - polygon
      - base
      - user
      - arbitrum
      - stellar
      - monad
      - tempo
      title: Blockchain
    OperationalBlockchain:
      oneOf:
      - $ref: '#/components/schemas/Blockchain.SOLANA'
      - $ref: '#/components/schemas/Blockchain.ETH'
      - $ref: '#/components/schemas/Blockchain.POLYGON'
      - $ref: '#/components/schemas/Blockchain.BASE'
      - $ref: '#/components/schemas/Blockchain.ARBITRUM'
      - $ref: '#/components/schemas/Blockchain.STELLAR'
      - $ref: '#/components/schemas/Blockchain.MONAD'
      - $ref: '#/components/schemas/Blockchain.TEMPO'
      title: OperationalBlockchain
    Blockchain.BASE:
      type: string
      enum:
      - base
      title: Blockchain.BASE
    TotalsResponse:
      type: object
      properties:
        subtotal:
          $ref: '#/components/schemas/CurrencyCents'
        creditCardFees:
          $ref: '#/components/schemas/CurrencyCents'
        chargebackProtectionFees:
          $ref: '#/components/schemas/CurrencyCents'
        gasFees:
          $ref: '#/components/schemas/CurrencyCents'
        fxFees:
          $ref: '#/components/schemas/CurrencyCents'
        networkFees:
          $ref: '#/components/schemas/CurrencyCents'
        payInFees:
          $ref: '#/components/schemas/CurrencyCents'
        total:
          $ref: '#/components/schemas/CurrencyCents'
        reserve:
          $ref: '#/components/schemas/CurrencyCents'
        merchantPaidCreditCardFees:
          $ref: '#/components/schemas/CurrencyCents'
        merchantPaidChargebackProtectionFees:
          $ref: '#/components/schemas/CurrencyCents'
        merchantPaidGasFees:
          $ref: '#/components/schemas/CurrencyCents'
        merchantPaidFxFees:
          $ref: '#/components/schemas/CurrencyCents'
        merchantPaidNetworkFees:
          $ref: '#/components/schemas/CurrencyCents'
        invoicedCreditCardFees:
          $ref: '#/components/schemas/CurrencyCents'
        invoicedChargebackProtectionFees:
          $ref: '#/components/schemas/CurrencyCents'
        invoicedGasFees:
          $ref: '#/components/schemas/CurrencyCents'
        invoicedFxFees:
          $ref: '#/components/schemas/CurrencyCents'
        invoicedNetworkFees:
          $ref: '#/components/schemas/CurrencyCents'
        rebate:
          $ref: '#/components/schemas/CurrencyCents'
        invoicedRebate:
          $ref: '#/components/schemas/CurrencyCents'
      required:
      - subtotal
      - creditCardFees
      - chargebackProtectionFees
      - gasFees
      - fxFees
      - total
      title: TotalsResponse
    SubscriptionStatus:
      type: string
      enum:
      - Active
      - Canceled
      - Expired
      - Concluded
      - Failed
      - Blocked
      title: SubscriptionStatus
    Currency:

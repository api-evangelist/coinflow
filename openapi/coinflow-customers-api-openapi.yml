    CardData:
      type: object
      properties:
        cardToken:
          type: string
          minLength: 1
          description: This is the card token received from the `CoinflowCardNumberInput`
        expYear:
          type: string
          pattern: ^\d+$
          minLength: 2
          maxLength: 2
          description: 'The Cards Expiration Year ex: 2026 => 26'
        expMonth:
          type: string
          pattern: ^\d+$
          minLength: 2
          maxLength: 2
          description: 'The Cards Expiration Month ex: January => 01 December => 12'
        additionalVendorData:
          $ref: '#/components/schemas/CardDataAdditionalVendorData'
          description: 'Optional non-PCI passthrough fields merged into the stored card vendorData.

            Base type is empty; tokenization providers extend it with their own fields.'
        email:
          type: string
          pattern: (([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))
        businessName:
          type: string
        firstName:
          type: string
          minLength: 2
        lastName:
          type: string
          minLength: 2
        address1:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        zip:
          type: string
        state:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
      required:
      - cardToken
      - expYear
      - expMonth
      - email
      - firstName
      - lastName
      - address1
      - city
      - country
      title: CardData

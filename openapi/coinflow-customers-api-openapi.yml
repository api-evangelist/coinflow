openapi: 3.2.0
info:
  title: Reference Customers API
  version: 1.0.0
servers:
- url: https://api-sandbox.coinflow.cash/api
  description: https://api-sandbox.coinflow.cash/api
tags:
- name: Customers
paths:
  /customer/v2/bankAccount:
    post:
      operationId: customers_AddBankAccount
      summary: Add Bank Account
      description: Adds a bank account for a given customer
      tags:
      - Customers
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pick_AddACHBankAccountData.Exclude_keyofAddACHBankAccountData.plaidAccountId__'
      security:
      - wallet: []
  /customer/plaid-check:
    post:
      operationId: customers_PlaidCheck
      summary: Bank Account Status Check
      description: 'Checks whether a customer''s linked bank account is still active and

        valid. Returns a normalized status (`active`, `removed`, `login_required`,

        or `error`) that merchants can use to gate transaction attempts before

        submission.'
      tags:
      - Customers
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultiPlaidAccountStatusResponse'
      requestBody:
        description: '- The customerId identifying the customer whose linked

          account should be checked, and an optional bankAccountToken to identify

          a specific bank account. If no token is provided, the customer''s most

          recently linked bank account will be checked.'
        content:
          application/json:
            schema:
              type: object
              properties:
                accounts:
                  type: array
                  items:
                    $ref: '#/components/schemas/CustomerPlaidCheckPostRequestBodyContentApplicationJsonSchemaAccountsItems'
              required:
              - accounts
      security:
      - merchant: []
  /customer/iban:
    post:
      operationId: customers_AddIban
      summary: Create an Iban account
      description: Create an Iban account for a given customer
      tags:
      - Customers
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantId:
                  type: string
                data:
                  $ref: '#/components/schemas/IbanData'
              required:
              - merchantId
              - data
      security:
      - sessionKey: []
  /customer/card:
    post:
      operationId: customers_CreateCardForCustomer
      summary: Create Card for Customer
      description: Create card for a particular customer
      tags:
      - Customers
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCustomerResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                card:
                  $ref: '#/components/schemas/CardData'
              required:
              - card
      security:
      - userId: []
  /customer:
    post:
      operationId: customers_CreateCustomer
      summary: Create Customer
      description: Creates a customer
      tags:
      - Customers
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCustomerResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customerInfo:
                  $ref: '#/components/schemas/CustomerInfo'
                email:
                  type: string
              required:
              - email
      security:
      - userId: []
  /customer/bankAccount/{token}:
    delete:
      operationId: customers_DeleteBankAccount
      summary: Delete Bank Account
      description: Deletes a bank account for a given customer
      tags:
      - Customers
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - sessionKey: []
  /customer/card/{cardToken}:
    delete:
      operationId: customers_DeleteCard
      summary: Delete Card
      description: Deletes the card for a particular customer
      tags:
      - Customers
      parameters:
      - name: cardToken
        in: path
        description: '- Token of the card to delete'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - sessionKey: []
  /customer/iban/{token}:
    delete:
      operationId: customers_DeleteIban
      summary: Delete Iban Account
      description: Deletes an Iban account for a given customer
      tags:
      - Customers
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - sessionKey: []
  /customer/interac/{token}:
    delete:
      operationId: customers_DeleteInterac
      summary: Delete Interac Account
      description: Deletes an Interac account for a given customer
      tags:
      - Customers
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - sessionKey: []
  /customer/paypal/{token}:
    delete:
      operationId: customers_DeletePaypal
      summary: Delete PayPal Account
      description: Deletes a saved PayPal account for a given customer
      tags:
      - Customers
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - sessionKey: []
  /customer/venmo/{token}:
    delete:
      operationId: customers_DeleteVenmo
      summary: Delete Venmo Account
      description: Deletes a saved Venmo account for a given customer
      tags:
      - Customers
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
      security:
      - sessionKey: []
  /customer/balances/{merchantIdOrCreditSeed}:
    get:
      operationId: customers_GetCheckoutBalances
      summary: Get Balances
      description: Gets the balances of credits, usdc, and an optional token for a particular wallet
      tags:
      - Customers
      parameters:
      - name: merchantIdOrCreditSeed
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBalances'
      security:
      - sessionKey: []
  /customer/v2:
    get:
      operationId: customers_GetCustomer
      summary: Get Customer
      description: Gets the Customer record for a particular user.
      tags:
      - Customers
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCustomerResponse'
        '412':
          description: No customer associated with customerId, will also return this code if the customer exists, but they have no payment methods are available.
          content:
            application/json:
              schema:
                type: number
                format: double
        '451':
          description: Must Complete Additional Verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequiredResponse'
      security:
      - sessionKey: []
  /customer/history:
    get:
      operationId: customers_GetHistory
      summary: Get Purchase History
      description: Gets the Purchase History for a particular Customer
      tags:
      - Customers
      parameters:
      - name: paymentId
        in: query
        description: '- Optional payment id to filter the request by'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customers_GetHistory_Response_200'
      security:
      - sessionKey: []
  /customer/history/{paymentId}:
    get:
      operationId: customers_GetCustomerPaymentById
      summary: Get Purchase History By ID
      description: Gets the Purchase for a Customer by ID
      tags:
      - Customers
      parameters:
      - name: paymentId
        in: path
        description: '- Payment id to filter the request by'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customers_GetCustomerPaymentById_Response_200'
      security:
      - sessionKey: []
components:
  schemas:
    CardSettings:
      type: object
      properties:
        rebateBps:
          type: number
          format: double
        rebateFixed:
          $ref: '#/components/schemas/Cents'
        processor:
          $ref: '#/components/schemas/PaymentProcessor'
        orchestrationRuleId:
          type: string
        applePayProcessor:
          $ref: '#/components/schemas/PaymentProcessor'
        googlePayProcessor:
          $ref: '#/components/schemas/PaymentProcessor'
        creditCardFeeMode:
          $ref: '#/components/schemas/FeePayerMode'
        chargebackProtectionFeeMode:
          $ref: '#/components/schemas/FeePayerMode'
        gasFeeMode:
          $ref: '#/components/schemas/FeePayerMode'
        fxFeeMode:
          $ref: '#/components/schemas/FeePayerMode'
        networkFeeMode:
          $ref: '#/components/schemas/FeePayerMode'
        customerEmailNotifications:
          type: boolean
        merchantEmailNotifications:
          type: boolean
        fixedFee:
          $ref: '#/components/schemas/Cents'
        variableFeeBps:
          type: number
          format: double
        networkFeeBps:
          type: number
          format: double
        networkFixedFee:
          $ref: '#/components/schemas/Cents'
        supportsGooglePay:
          type: boolean
        supportsApplePay:
          type: boolean
        saveCardDefault:
          type: boolean
        ignoreProcessorLimit:
          type: boolean
        nameMatchThreshold:
          type: number
          format: double
        verificationSettings:
          $ref: '#/components/schemas/CardSettingsVerificationSettings'
        avsCheck:
          type: boolean
        threeDsChallengePreference:
          $ref: '#/components/schemas/ThreeDsChallengePreference'
        enforce3DSWhenProtectionExempt:
          type: boolean
        greenlightMerchantArgs:
          $ref: '#/components/schemas/GreenlightMerchantArgs'
        nuveiV1MerchantArgs:
          $ref: '#/components/schemas/NuveiV1MerchantArgs'
        crbMerchantArgs:
          $ref: '#/components/schemas/CrbMerchantSettings'
        highnoteMerchantArgs:
          $ref: '#/components/schemas/HighnoteMerchantSettings'
        payarcMerchantArgs:
          $ref: '#/components/schemas/PayarcMerchantArgs'
        threeDSArgs:
          $ref: '#/components/schemas/ThreeDSArgs'
        statementDescriptor:
          type: string
        tokenizationProvider:
          $ref: '#/components/schemas/TokenizationProviderOption'
        applePayIntegratorRegistration:
          $ref: '#/components/schemas/ApplePayIntegratorRegistration'
        applePayMerchantDecryption:
          type: boolean
        applePayCertificates:
          $ref: '#/components/schemas/CardSettingsApplePayCertificates'
        aftSettings:
          $ref: '#/components/schemas/AftSettings'
        customStatementDescriptor:
          type: boolean
        cardOnFileSettings:
          $ref: '#/components/schemas/CardOnFileSettings'
        mitSettings:
          $ref: '#/components/schemas/CardOnFileSettings'
        blockCardReuseAcrossCustomers:
          type: boolean
          description: When true, blocks a card payment if the same card token has been used by a different customer for this merchant.
        allowedCardNetworks:
          type: array
          items:
            $ref: '#/components/schemas/CardType'
        allowServerToServerTokenization:
          type: boolean
        visaFraudMonitoringProgram:
          type: boolean
        debitOnly:
          type: boolean
        refundFeeSettings:
          $ref: '#/components/schemas/RefundFeeSettings'
        paymentTokenOrchestrationTrainingPercentage:
          type: number
          format: double
      required:
      - customerEmailNotifications
      - merchantEmailNotifications
      - avsCheck
      - threeDsChallengePreference
      - enforce3DSWhenProtectionExempt
      title: CardSettings
    IMerchantStringWalletsSolana:
      type: object
      properties:
        usdcPayer:
          type: string
        feePayer:
          type: string
      required:
      - usdcPayer
      - feePayer
      title: IMerchantStringWalletsSolana
    MerchantStyle:
      type: string
      enum:
      - rounded
      - sharp
      - pill
      title: MerchantStyle
    InteracPayoutProvider:
      type: string
      enum:
      - checkbook
      - mock
      - aptpay
      title: InteracPayoutProvider
    AftSettings:
      type: object
      properties:
        enabled:
          type: boolean
        type:
          $ref: '#/components/schemas/AftType'
        purpose:
          $ref: '#/components/schemas/AftPurpose'
        merchantA2AMastercardAftRecipient:
          $ref: '#/components/schemas/AftSettingsMerchantA2AMastercardAftRecipient'
      required:
      - enabled
      - type
      - purpose
      title: AftSettings
    SubscriptionDisplay:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        blockchain:
          $ref: '#/components/schemas/Blockchain'
        merchantId:
          type: string
        email:
          type: string
        plan:
          type: string
        planCode:
          type: string
        nextPaymentAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
      required:
      - id
      - customerId
      - merchantId
      - email
      - plan
      - planCode
      - status
      title: SubscriptionDisplay
    Blockchain:
      type: string
      enum:
      - solana
      - eth
      - polygon
      - base
      - user
      - arbitrum
      - stellar
      - monad
      - tempo
      title: Blockchain
    BlockingRuleMethod:
      type: string
      enum:
      - KYC_ADDRESS
      - IP
      - BILLING_ADDRESS
      - GEOLOCATION
      - BIN
      title: BlockingRuleMethod
    PlaidAccountStatus:
      type: string
      enum:
      - active
      - pending_expiration
      - login_required
      - removed
      - error
      title: PlaidAccountStatus
    PaymentHistory:
      type: object
      properties:
        paymentId:
          type: string
        merchant:
          type: string
        totals:
          $ref: '#/components/schemas/TotalsResponse'
        createdAt:
          type: string
          format: date-time
        status:
          type: string
        signature:
          type: string
        subscription:
          $ref: '#/components/schemas/SubscriptionDisplay'
      required:
      - paymentId
      - merchant
      - totals
      - createdAt
      - status
      title: PaymentHistory
    IMobileAccountWithExpiry:
      type: object
      properties:
        alias:
          type: string
        token:
          type: string
        type:
          $ref: '#/components/schemas/IMobileAccountWithExpiryType'
        disbursementStatus:
          $ref: '#/components/schemas/DisbursementStatus'
        currency:
          $ref: '#/components/schemas/Currency'
        retiredTokens:
          type: array
          items:
            type: string
        genus:
          $ref: '#/components/schemas/MobileGenus'
        deletedAt:
          type: string
          format: date-time
        hasAddress:
          type: boolean
        expMonth:
          type: string
        expYear:
          type: string
      required:
      - alias
      - token
      - type
      - genus
      - hasAddress
      title: IMobileAccountWithExpiry
    PayoutProviderOption:
      type: string
      enum:
      - aptpay
      - coinfx
      - checkbook
      - BRAID
      - brale
      - mock
      title: PayoutProviderOption
    PixPayoutProvider:
      type: string
      enum:
      - avenia
      - brla
      - mock
      title: PixPayoutProvider
    IvySettings:
      type: object
      properties:
        gbpPayinAccountId:
          type: string
        eurAccountId:
          type: string
      required:
      - gbpPayinAccountId
      - eurAccountId
      title: IvySettings
    CustomerVenmoAccount:
      type: object
      properties:
        isDeleted:
          type: boolean
        alias:
          type: string
        token:
          type: string
        type:
          $ref: '#/components/schemas/CustomerVenmoAccountType'
        vaulted:
          type: boolean
          description: 'Derived, not persisted: true when the account holds a Venmo vault token

            and the merchant has vaulting enabled — the frontend''s signal to use the

            one-click vaulted checkout.'
      required:
      - alias
      - token
      - type
      description: Saved Venmo account as returned on customer responses.
      title: CustomerVenmoAccount
    IMerchantFraudNetwork:
      type: object
      properties:
        enabled:
          type: boolean
        sharing:
          type: boolean
      required:
      - enabled
      - sharing
      title: IMerchantFraudNetwork
    OnboardingVersion:
      type: string
      enum:
      - legacy
      - sdd
      - global
      title: OnboardingVersion
    ApplePayIntegratorRegistration:
      type: object
      properties:
        domainNames:
          type: array
          items:
            type: string
        partnerMerchantName:
          type: string
        partnerMerchantValidationURI:
          type: string
        partnerInternalMerchantIdentifier:
          type: string
      required:
      - domainNames
      - partnerMerchantName
      - partnerMerchantValidationURI
      - partnerInternalMerchantIdentifier
      title: ApplePayIntegratorRegistration
    DirectVendorSettlement:
      type: string
      enum:
      - brale
      title: DirectVendorSettlement
    CustomPayInFeeValue0:
      type: object
      properties:
        cents:
          type: number
          format: double
        currency:
          $ref: '#/components/schemas/Currency'
        percent:
          type:
          - number
          - 'null'
          format: double
        isFixed:
          type: boolean
      required:
      - cents
      - currency
      - percent
      - isFixed
      title: CustomPayInFeeValue0
    CrbBusinessType:
      type: string
      enum:
      - AA
      - BB
      - CD
      - CP
      - FD
      - FT
      - PP
      - WT
      - BI
      title: CrbBusinessType
    BlockedLevel:
      type: string
      enum:
      - Unverified
      - Suspended
      title: BlockedLevel
    BankAccountType:
      type: string
      enum:
      - checking
      - savings
      title: BankAccountType
    RainAutoTopUpCadence:
      type: string
      enum:
      - transaction
      - hour
      - day
      - week
      - month
      title: RainAutoTopUpCadence
    StableCoin:
      type: string
      enum:
      - USDC
      - SBC
      - EUROe
      - FXUSD
      - HSUSD
      - CFUSD
      - YPUSD
      title: StableCoin
    OrderType:
      type: string
      enum:
      - one_time_purchase
      - recurring_subscription
      - recurring_balance_top_up
      - limit_order
      - fair_market_value
      title: OrderType
    Customers_GetCustomerPaymentById_Response_200:
      type: object
      properties:
        payment:
          $ref: '#/components/schemas/PaymentHistory'
      required:
      - payment
      title: Customers_GetCustomerPaymentById_Response_200
    AdditionalVerification:
      type: object
      properties:
        name:
          type: string
        link:
          type: string
        reference:
          type: string
        vendor:
          $ref: '#/components/schemas/VerificationVendor'
        sessionToken:
          type: string
      required:
      - name
      - link
      - reference
      - vendor
      title: AdditionalVerification
    RainContractInfo:
      type: object
      properties:
        contractId:
          type: string
        chainId:
          type: number
          format: double
        depositAddress:
          type: string
        programAddress:
          type: string
        proxyAddress:
          type: string
        controllerAddress:
          type: string
        contractVersion:
          type: number
          format: double
        adminAddresses:
          type: array
          items:
            type: string
        onramp:
          $ref: '#/components/schemas/RainContractInfoOnramp'
        createdAt:
          type: string
          format: date-time
        lastSyncedAt:
          type: string
          format: date-time
      required:
      - contractId
      - chainId
      - depositAddress
      - createdAt
      - lastSyncedAt
      title: RainContractInfo
    MerchantBankSettlementOptions:
      type: object
      properties:
        token:
          type: string
        minRemainingBalance:
          $ref: '#/components/schemas/Cents'
        useWire:
          type: boolean
      required:
      - token
      - minRemainingBalance
      title: MerchantBankSettlementOptions
    PickICustomerWithAccountsExcludeKeyofICustomerWithAccountsFraudControlFieldsMerchant:
      oneOf:
      - type: string
      - $ref: '#/components/schemas/IMerchant_string_'
      title: PickICustomerWithAccountsExcludeKeyofICustomerWithAccountsFraudControlFieldsMerchant
    WebhookSettings:
      type: object
      properties:
        webhookUrls:
          type: array
          items:
            type: string
        disabledWebhookUrls:
          type: array
          items:
            type: string
        version:
          $ref: '#/components/schemas/WebhookVersion'
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        disableAuthorizationHeader:
          type: boolean
        disableSubmerchantToParentWebhooks:
          type: boolean
      required:
      - webhookUrls
      - version
      - subscriptions
      title: WebhookSettings
    IMobileAccountWithExpiryType:
      type: string
      enum:
      - mobile
      title: IMobileAccountWithExpiryType
    VenmoSettings:
      type: object
      properties:
        rebateBps:
          type: number
          format: double
        rebateFixed:
          $ref: '#/components/schemas/Cents'
        processor:
          $ref: '#/components/schemas/VenmoProcessor'
        feeMode:
          $ref: '#/components/schemas/FeePayerMode'
        fxFeeMode:
          $ref: '#/components/schemas/FeePayerMode'
        maxFee:
          $ref: '#/components/schemas/Cents'
        fixedFee:
          $ref: '#/components/schemas/Cents'
        feeBps:
          type: number
          format: double
        minFee:
          $ref: '#/components/schemas/Cents'
        customerEmailNotifications:
          type: boolean
        merchantEmailNotifications:
          type: boolean
        refundFeeSettings:
          $ref: '#/components/schemas/RefundFeeSettings'
        blockPayerReuseAcrossCustomers:
          type: boolean
          description: When true, blocks a Venmo payment if the same Venmo payer identity (payerId/email) has been used by a different customer for this merchant.
        nameMatchThreshold:
          type: number
          format: double
          description: 0–100 fuzzy-match floor for the Venmo buyer name vs. the customer's name; below it the payment is failed before authorizing. Unset = disabled.
        vaultingEnabled:
          type: boolean
      required:
      - fixedFee
      - feeBps
      - customerEmailNotifications
      - merchantEmailNotifications
      title: VenmoSettings
    VendorSettingsKoard:
      type: object
      properties:
        enabled:
          type: boolean
        apiKeyPreview:
          type: string
        apiKeyId:
          type: string
        apiKey:
          type: string
        accountId:
          type: string
      required:
      - accountId
      title: VendorSettingsKoard
    VerisoulSettings:
      type: object
      properties:
        enabled:
          type: boolean
        riskThresholds:
          $ref: '#/components/schemas/VerisoulRiskThresholds'
      required:
      - enabled
      - riskThresholds
      title: VerisoulSettings
    CryptoPayoutTierSettings:
      type: object
      properties:
        enabled:
          type: boolean
        feeBps:
          type: number
          format: double
        feeFixedCents:
          type: number
          format: double
      required:
      - enabled
      - feeBps
      - feeFixedCents
      title: CryptoPayoutTierSettings
    CardType:
      type: string
      enum:
      - VISA
      - MSTR
      - AMEX
      - DISC
      title: CardType
    RefundFeeSettings:
      type: object
      properties:
        feeBps:
          type: number
          format: double
        fixedFee:
          $ref: '#/components/schemas/Cents'
        minFee:
          $ref: '#/components/schemas/Cents'
        maxFee:
          $ref: '#/components/schemas/Cents'
      title: RefundFeeSettings
    IWireProviderSettings:
      type: object
      properties:
        rebateBps:
          type: number
          format: double
        rebateFixed:
          $ref: '#/components/schemas/Cents'
        processor:
          $ref: '#/components/schemas/WireProcessor'
        feeMode:
          $ref: '#/components/schemas/FeePayerMode'
        fxFeeMode:
          $ref: '#/components/schemas/FeePayerMode'
        customerEmailNotifications:
          type: boolean
        merchantEmailNotifications:
          type: boolean
        minFee:
          $ref: '#/components/schemas/Cents'
        maxFee:
          $ref: '#/components/schemas/Cents'
        feeBps:
          type: number
          format: double
        fixedFee:
          $ref: '#/components/schemas/Cents'
        dailyLimit:
          $ref: '#/components/schemas/Cents'
        refundFeeSettings:
          $ref: '#/components/schemas/RefundFeeSettings'
      required:
      - customerEmailNotifications
